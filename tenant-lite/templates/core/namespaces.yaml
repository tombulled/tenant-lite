{{- range $id, $data := .Values.namespaces }}
{{- with include "tenant.data" (dict "root" $ "id" $id "data" $data) | fromYaml }}
---
apiVersion: v1
kind: Namespace
{{ include "tenant.metadata-omitting" (list . "finalizers" "namespace") }}
spec:
  {{- include "tenant.field" (list "finalizers" .finalizers 2) }}
{{- end }}
{{- end }}
