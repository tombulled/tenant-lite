{{- range include "tenant.datas" (dict
  "root"     $
  "values"   $.Values.namespaces
  "defaults" $.Values.namespaceDefaults
) | fromYamlArray }}
---
apiVersion: v1
kind: Namespace
{{ include "tenant.metadata-omitting" (list . "finalizers" "namespace") }}
spec:
  {{- include "tenant.field" (list "finalizers" .finalizers 2) }}
{{- end }}
