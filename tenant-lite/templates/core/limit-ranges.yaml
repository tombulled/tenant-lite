{{- range include "tenant.datas" (dict
  "root"     $
  "values"   $.Values.limitRanges
  "defaults" $.Values.limitRangeDefaults
) | fromYamlArray }}
---
apiVersion: v1
kind: LimitRange
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field.list" (list "limits" .limits 2) }}
{{- end }}
