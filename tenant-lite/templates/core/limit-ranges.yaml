{{- range $id, $data := .Values.limitRanges }}
{{- with include "tenant.data" (dict "root" $ "id" $id "data" $data "defaults" $.Values.limitRangeDefaults) | fromYaml }}
---
apiVersion: v1
kind: LimitRange
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field.list" (list "limits" .limits 2) }}
{{- end }}
{{- end }}
