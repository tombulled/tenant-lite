{{- range include "tenant.datas" (dict
  "root"     $
  "values"   $.Values.resourceQuotas
  "defaults" $.Values.resourceQuotaDefaults
) | fromYamlArray }}
---
apiVersion: v1
kind: ResourceQuota
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field" (list "hard"          .hard          2) }}
  {{- include "tenant.field" (list "scopeSelector" .scopeSelector 2) }}
  {{- include "tenant.field" (list "scopes"        .scopes        2) }}
{{- end }}
