{{- range include "tenant.datas" (dict
  "root"     $
  "values"   $.Values.sealedSecrets
  "defaults" $.Values.sealedSecretDefaults
) | fromYamlArray }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field" (list "data"          .data          2) }}
  {{- include "tenant.field" (list "encryptedData" .encryptedData 2) }}
  {{- include "tenant.field" (list "template"      .template      2) }}
{{- end }}
