{{- range $id, $data := .Values.sealedSecrets }}
{{- with include "tenant.data" (dict "root" $ "id" $id "data" $data "defaults" $.Values.sealedSecretDefaults) | fromYaml }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field" (list "data" .data 2) }}
  {{- include "tenant.field" (list "encryptedData" .encryptedData 2) }}
  {{- include "tenant.field" (list "template" .template 2) }}
{{- end }}
{{- end }}
