{{- range include "tenant.datas" (dict
  "root" $
  "values" $.Values.roleBindings
  "defaults" $.Values.roleBindingDefaults
) | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
{{ include "tenant.metadata" . }}
{{- include "tenant.field" (list "roleRef" .roleRef) }}
{{- include "tenant.field.list" (list "subjects" .subjects) }}
{{- end }}
