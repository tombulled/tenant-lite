{{- range include "tenant.datas" (dict
  "root"     $
  "values"   $.Values.networkPolicies
  "defaults" $.Values.networkPolicyDefaults
) | fromYamlArray }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "tenant.metadata" . }}
spec:
  {{- include "tenant.field.list" (list "egress"      .egress      2) }}
  {{- include "tenant.field.list" (list "ingress"     .ingress     2) }}
  {{- include "tenant.field"      (list "podSelector" .podSelector 2) }}
  {{- include "tenant.field"      (list "policyTypes" .policyTypes 2) }}
{{- end }}
